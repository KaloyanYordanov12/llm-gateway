name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A single command runs tests + JaCoCo + Checkstyle + SpotBugs and
      # generates the PIT report. GitHub-hosted runners provide Docker, which
      # later phases use for Testcontainers.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  # Builds the Docker image on infrastructure that isn't the laptop, so a
  # Docker-only breakage (e.g. a bad COPY) can't slip through. On pull requests it
  # only builds; on pushes to main it also publishes the image to GHCR. The image
  # is a portfolio/repro artifact — the production runtime stays jar-under-systemd.
  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/kaloyanyordanov12/llm-gateway:latest
            ghcr.io/kaloyanyordanov12/llm-gateway:${{ steps.vars.outputs.sha_short }}
