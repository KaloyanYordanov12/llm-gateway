spring:
  application:
    name: llm-gateway
  jackson:
    # Anthropic's wire shape is snake_case (request_id, max_tokens, top_p,
    # stop_sequences); use it globally so DTOs stay idiomatic camelCase in Java.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    # Safe local/compose defaults; overridable via env. No real secret needed.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates entities against it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# Gateway configuration. The pricing table doubles as the model allowlist:
# a model absent here is rejected with 400 (fail-secure). Rates are per 1,000
# tokens; adjust to real provider pricing in production.
gateway:
  pricing:
    models:
      claude-3-5-sonnet-20241022:
        input-per-1k: "0.003"
        output-per-1k: "0.015"
      claude-3-5-haiku-20241022:
        input-per-1k: "0.0008"
        output-per-1k: "0.004"

management:
  endpoints:
    web:
      exposure:
        # Phase 0: only the health endpoint is exposed.
        include: health
  endpoint:
    health:
      show-details: never
