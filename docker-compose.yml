services:
  app:
    build: .
    image: llm-gateway:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gateway
      DB_USER: gateway
      DB_PASSWORD: gateway
      # Admin key for the dashboard/management API. Override with a real secret in
      # production; this is an obviously-fake dev default.
      GATEWAY_ADMIN_KEY: dev-admin-key
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
